[project]
name = "aeroshape"
version = "0.1.0"
requires-python = ">=3.10,<3.14"
dependencies = ["torch>=2.4", "numpy", "scipy", "matplotlib", "pyyaml", "tqdm", "imageio"]

[project.optional-dependencies]
dev = ["pytest", "pytest-timeout", "ruff", "tensorboard"]
viz3d = ["pyvista"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aeroshape"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: > 30 s",
  "gpu: needs MPS or CUDA",
  "float64: CPU only",
  "e2e: runs scripts/00_smoke_e2e.py",
]
addopts = "-m 'not slow and not e2e'"
