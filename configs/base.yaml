seed: 0
device: auto

geometry:
  k: 8                    # control points per surface (G2)
  degree: 3
  mode: symmetric         # symmetric | cambered
  M: 160                  # surface samples per side
  x_spacing: cosine
  weights: ones

lbm:
  mach: 0.1
  domain_d: [20, 10]      # domain size in reference lengths (x, y)
  body_offset_d: 5        # leading edge (or centre for cylinder) distance from inlet
  cells_per_d: 20
  cells_per_d_high_re: 48  # Re >= 100 runs (tau ~ 0.52 is unstable at N=10); tiers override
  collision: bgk          # bgk | trt
  outlet: fixed           # fixed (report, adjoint runs) | extrapolate (unsteady runs); passed to step(outlet=...)
  trt_magic: 0.1875
  sponge: {enabled: false, width_d: 1.5, nu_factor: 10}
  steady_tol: 1.0e-6
  max_convective_times: 60
  average_periods: 4
  record_every: 50
  transient: 30           # convective times before unsteady period detection starts
  transient_warm: 5       # same, for a warm-started unsteady forward run (wake already developed)
  window_convective_times: 20  # unsteady runs with no detectable period: mean over this many convective times (W >= 20)
  compile: false          # torch.compile the forward step in run() (opt-in; adjoint path stays eager)
  cuda_graph: false       # CUDA only: replay graph_steps-step CUDA graphs between record steps (forward run() only)
  graph_steps: 49         # <= record_every-1 (run() clamps)
  perturb: 0.0            # init_state transverse kick (fraction of U_lb); unsteady cases set 0.1

adjoint:
  mode: steady            # steady | time_averaged
  horizon_convective_times: 20
  tol: 1.0e-8
  impl: hand              # hand | vjp
  solver: krylov          # krylov (restarted GMRES, default) | fixed_point; time_averaged mode always iterates for a fixed horizon

pinn:
  model: transformer      # transformer | mlp
  d_model: 128
  heads: 4
  self_attn_layers: 2
  cross_attn_layers: 2
  mlp_hidden: 128
  mlp_layers: 6
  fourier_features: 64
  fourier_scale: 2.0
  version: v1             # v1 steady | v2 with forcing
  domain_box: [-1.5, 4.0, -1.5, 1.5]   # x_min, x_max, y_min, y_max (non-dim); equals dataset.window_d

loss:
  w_pde: 1.0
  w_wall: 10.0
  w_edge: 5.0             # window-edge anchor values (replaces analytic inlet/outlet, see ns_loss_and_sampling.md)
  w_pin: 1.0              # pressure gauge: mean p on the outlet edge matches anchors
  w_data: 10.0
  w_force: 1.0e-2
  w_grad: 0.0             # G30: weight of the adjoint-gradient mismatch of CD (and CL at half weight); 0 = off
  w_cd: 0.0               # G29: weight of (CD - CD_lbm)^2 + (CL - CL_lbm)^2 from the stress integrator; 0 = off
  c_p: 0.25               # pressure weight inside data term
  balance_every: 0        # 0 = off; else gradient-norm balancing period

sampling:
  n_collocation: 4000
  wall_fraction: 0.5
  n_surface: 400
  n_anchor: 1000
  n_edge: 400

train:
  shapes_per_step: 8
  micro_batch_shapes: 8   # shapes per forward/backward; gradients accumulated up to shapes_per_step
  adam_steps: 5000
  lr: 1.0e-3
  lr_min: 1.0e-5
  weight_decay: 1.0e-4
  grad_clip: 1.0
  lbfgs_steps: 500
  warmup_data_only: 500
  pde_ramp: 1000
  eval_every: 250

dataset:
  n_shapes: 30
  n_holdout: 5
  conditions: [{re: 20, aoa: 0}]
  points_per_shape: 20000
  window_d: [-1.5, 4.0, -1.5, 1.5]
  edge_points: 2000       # extra points saved on the window edges

diffusion:
  n_shapes: 2000
  T: 1000
  layers: 4
  d_model: 128
  heads: 4
  cond_drop: 0.1
  steps: 20000
  batch: 256
  lr: 2.0e-4
  ema: 0.999
  sample_steps: 50
  cfg_scale: 2.0
  guide_scale: 1.0
  guide_clip: 1.0
  w_lift: 1.0
  mu_thickness: 40.0

optimizer:
  evaluator: adjoint_lbm  # adjoint_lbm | mlp_pinn | transformer_pinn
  max_cycles: 20
  eta: 0.05
  backtrack: 0.5
  rho_al: 10.0
  fd_delta: 5.0e-3        # fd_lbm evaluator: central-difference step on each free control point
  mu0: 10.0
  mu_max: 1.0e+4  # PyYAML needs the exponent sign, else this loads as a string
  kkt_tol: 1.0e-4
  cl_tol: 1.0e-2
  lam_step_max: 0.5       # max |change| of the CL multiplier lam per cycle
  g_cap: 0.02             # max control-point move per cycle (chord units), after the eta scaling (H1)
  cd_rtol: 1.0e-4         # stop when relative CD change < cd_rtol for 3 cycles; 0 disables
  box: null               # G37: pinn_train clamps alpha to the PINN train-split min/max box after each step
  max_flagged: 2          # stop (or reset eta) after this many consecutive cycles whose step did not decrease L (M5)
