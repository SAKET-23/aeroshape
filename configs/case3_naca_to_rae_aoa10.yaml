# Test Case 3: NACA2412 -> RAE2822 at AoA 10 deg, otherwise as case 2.
# adjoint.impl = vjp: the hand transpose supports BGK + fixed outlet only.
case: {re: 1000, aoa: 10, start: naca2412, target: rae2822, t_min: rae2822, cl_ref: "rae2822@lbm"}
geometry: {mode: cambered, k: 8}
lbm: {collision: trt, outlet: extrapolate, sponge: {enabled: true}, perturb: 0.1, trt_magic: 0.001}  # F1: Lambda 3/16 blows up at tau ~ 0.504 (see d2q9 tests)
adjoint: {mode: time_averaged, impl: vjp}
optimizer: {g_cap: 0.01}
diffusion: {guide_scale: 3.0, cfg_scale: 0.0}  # fallback; 05 prefers the accepted pair in the cambered diffusion run results.json
